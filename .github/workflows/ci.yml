name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The vulnerability database moves even when the code does not, so rescan
  # weekly. Scheduled runs only ever use the default branch.
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

# Least privilege: the jobs below only read the repository. The merge job uses
# its own token. No job here touches AWS, and there is deliberately no deploy
# workflow.
permissions:
  contents: read

# A new push to the same branch cancels the previous run, so a busy branch does
# not burn Actions minutes on results nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Keep the linter in step with the version README.md documents.
      GOLANGCI_LINT_VERSION: v2.12.2

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            infra/go.sum

      # GOOS, GOARCH, and CGO_ENABLED are deliberately not set at the workflow
      # level: the `build` target exports them itself, and setting them here
      # would make `go install` and `go test` cross-compile too.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      # `make lint` runs the linters and then `golangci-lint fmt --diff`, which
      # exits non-zero when gofmt or goimports would rewrite a file.
      # lint-go, not lint: the infra module is linted in its own job, which
      # already has the CDK dependency tree.
      - name: Lint and check formatting
        run: PATH="$(go env GOPATH)/bin:$PATH" make lint-go

      # Runs natively on the amd64 runner. -race needs cgo, which is why the
      # cgo-free setting belongs to the build target rather than to the job.
      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -n 1

      # Produces the linux/arm64 bootstrap binaries, exactly as a local
      # `make build` does.
      - name: Build for linux/arm64
        run: make build

      - name: Check that the binaries are arm64 and statically linked
        run: file bin/*/bootstrap

      # Catches an untidy go.mod, a missing go.sum, and any other file a build
      # step left behind. coverage.out and bin/ are gitignored.
      - name: Check that go.mod is tidy and the tree is clean
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after lint, test, and build:"
            git status --short
            exit 1
          fi

  infra:
    name: CDK lint, test, synth
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GOLANGCI_LINT_VERSION: v2.12.2

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            infra/go.sum

      # The CDK's Go API is a jsii binding: it drives the CDK's JavaScript in
      # a Node subprocess, and the cdk CLI is a Node program too. Go alone is
      # not enough to synthesize.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint and check formatting
        run: PATH="$(go env GOPATH)/bin:$PATH" make lint-infra

      - name: Test
        run: go test ./...
        working-directory: infra

      # The stack mounts bin/<command> as each Lambda's asset, so the Go
      # binaries have to exist before the app can synthesize.
      - name: Build the Lambda assets
        run: make build

      - name: Synth
        run: npx cdk synth -q
        working-directory: infra

      - name: Check that go.mod is tidy and the tree is clean
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after the infra checks:"
            git status --short
            exit 1
          fi
        working-directory: infra

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            infra/go.sum

      # DynamoDB Local and S3Mock, started by compose rather than as job
      # services so the same command works here and on a laptop.
      - name: Start the local services
        run: docker compose up -d --wait

      - name: Test
        run: |
          DYNAMODB_ENDPOINT=http://127.0.0.1:8000           S3_ENDPOINT=http://127.0.0.1:9090           AWS_REGION=ap-southeast-1           go test -count=1 -tags=integration ./internal/...

      - name: Stop the local services
        if: always()
        run: docker compose down -v

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GOVULNCHECK_VERSION: v1.9.0

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      # Reports only vulnerabilities that are actually reachable from this code.
      # With no dependencies yet, this effectively audits the Go version in
      # go.mod against the stdlib advisories.
      - name: Scan
        run: PATH="$(go env GOPATH)/bin:$PATH" govulncheck ./...

  merge:
    name: Merge
    # Runs only when both jobs above succeed, which is what makes this safe
    # without branch protection.
    needs: [go, infra, integration, govulncheck]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Pull requests opened by a human with write access, from a branch in this
    # repository. user.type excludes bots, so a Dependabot bump waits for a
    # human; head.repo excludes forks, which is also why the plain
    # pull_request trigger is safe here (GitHub withholds secrets from fork
    # runs).
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.user.type != 'Bot'
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      && github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # Deliberately no checkout: the token stays away from pull request code.
      - name: Squash and merge
        env:
          # A fine-grained PAT scoped to this repository, with Contents and
          # Pull requests set to read and write. GITHUB_TOKEN would also work,
          # but a merge it performs does not trigger workflows on the target
          # branch, so CI would never run on the merged trunk.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch
